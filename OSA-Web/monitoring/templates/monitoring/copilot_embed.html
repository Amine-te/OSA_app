{% extends 'monitoring/base.html' %}

{% block extra_head %}
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
    body.embedded-mode .content { height: 100% !important; }
    .embed-copilot-root {
        height: 100%;
        min-height: 0;
        padding: 0;
    }
    .embed-chat-card {
        display: flex;
        flex-direction: column;
        height: 100%;
        background: #0f1117;
        border: none;
        border-radius: 0;
    }
    .embed-chat-header {
        padding: 0.5rem 0.75rem;
        border-bottom: 1px solid #2a2d3e;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
    }
    .embed-chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 0.75rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
    }
    .message-bubble {
        max-width: 92%;
        padding: 0.65rem 0.9rem;
        border-radius: 10px;
        line-height: 1.45;
        font-size: 0.85rem;
    }
    .message-bubble.user {
        align-self: flex-end;
        background: linear-gradient(135deg, #1e3c72, #2a5298);
        color: #fff;
    }
    .message-bubble.assistant {
        align-self: flex-start;
        background: rgba(18, 21, 31, 0.95);
        color: #e2e8f0;
        border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .message-bubble table { width: 100%; font-size: 0.75rem; border-collapse: collapse; }
    .message-bubble th, .message-bubble td { border: 1px solid rgba(255,255,255,0.1); padding: 0.25rem 0.4rem; }
    .embed-suggestions {
        display: flex;
        gap: 0.4rem;
        overflow-x: auto;
        padding: 0.4rem 0.75rem;
        border-top: 1px solid #2a2d3e;
        flex-shrink: 0;
    }
    .embed-suggestion {
        font-size: 0.7rem;
        padding: 0.35rem 0.6rem;
        border-radius: 12px;
        background: rgba(26, 29, 46, 0.9);
        border: 1px solid rgba(255,255,255,0.08);
        color: #8892a4;
        white-space: nowrap;
        cursor: pointer;
    }
    .embed-suggestion:hover { border-color: #00e676; color: #fff; }
    .embed-input-row {
        display: flex;
        gap: 0.5rem;
        padding: 0.6rem 0.75rem;
        border-top: 1px solid #2a2d3e;
        flex-shrink: 0;
    }
    .embed-input-row textarea {
        flex: 1;
        background: #0c0e14;
        border: 1px solid #2a2d3e;
        border-radius: 8px;
        color: #fff;
        font-size: 0.85rem;
        padding: 0.5rem 0.75rem;
        resize: none;
        height: 42px;
    }
    .embed-input-row button {
        width: 42px;
        height: 42px;
        border: none;
        border-radius: 8px;
        background: #00e676;
        color: #000;
    }
    .typing-indicator {
        display: flex;
        gap: 4px;
        padding: 0.5rem;
        align-self: flex-start;
    }
    .typing-dot {
        width: 6px;
        height: 6px;
        background: #8892a4;
        border-radius: 50%;
        animation: bounce 1.4s infinite ease-in-out both;
    }
    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce {
        0%, 80%, 100% { transform: scale(0); }
        40% { transform: scale(1); }
    }
</style>
{% endblock %}

{% block content %}
<div class="embed-copilot-root">
    <div class="embed-chat-card">
        <div class="embed-chat-header">
            <small class="text-muted-custom" id="embed-status">Ready</small>
            <button type="button" class="btn btn-sm btn-outline-danger py-0 px-2" id="clear-chat-btn" title="Clear chat">
                <i class="bi bi-trash"></i>
            </button>
        </div>
        <div class="embed-chat-messages" id="chat-messages-box">
            <div class="message-bubble assistant">
                <strong>OSA AI Co-pilot</strong>
                <p class="mb-0 mt-1">Ask about inventory, cameras, sessions, or alerts.</p>
            </div>
        </div>
        <div class="embed-suggestions">
            <span class="embed-suggestion" onclick="useSuggestion('Current inventory status?')">Inventory</span>
            <span class="embed-suggestion" onclick="useSuggestion('Any active sessions?')">Sessions</span>
            <span class="embed-suggestion" onclick="useSuggestion('Recent alerts?')">Alerts</span>
        </div>
        <div class="embed-input-row">
            <textarea id="prompt-input" placeholder="Ask a question..." rows="1"></textarea>
            <button type="button" id="send-button" onclick="submitUserQuery()" title="Send">
                <i class="bi bi-send-fill" id="send-icon"></i>
            </button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    marked.setOptions({ breaks: true, gfm: true });

    const chatBox = document.getElementById('chat-messages-box');
    const promptInput = document.getElementById('prompt-input');
    const sendButton = document.getElementById('send-button');
    const statusEl = document.getElementById('embed-status');
    const clearChatBtn = document.getElementById('clear-chat-btn');

    promptInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            submitUserQuery();
        }
    });

    function useSuggestion(text) {
        promptInput.value = text;
        promptInput.focus();
    }

    function scrollChatToBottom() {
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function setStatus(text, kind) {
        statusEl.textContent = text;
        statusEl.className = 'small ' + (kind === 'ok' ? 'text-ok' : kind === 'err' ? 'text-critical' : 'text-muted-custom');
    }

    function toggleSending(on) {
        promptInput.disabled = on;
        sendButton.disabled = on;
        document.getElementById('send-icon').className = on ? 'bi bi-hourglass-split' : 'bi bi-send-fill';
        const old = document.getElementById('chat-typing-indicator');
        if (old) old.remove();
        if (on) {
            const el = document.createElement('div');
            el.className = 'typing-indicator';
            el.id = 'chat-typing-indicator';
            el.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
            chatBox.appendChild(el);
            scrollChatToBottom();
        }
    }

    function appendMessageBubble(text, role) {
        const bubble = document.createElement('div');
        bubble.className = 'message-bubble ' + role;
        if (role === 'user') {
            bubble.textContent = text;
        } else {
            bubble.innerHTML = marked.parse(text);
        }
        chatBox.appendChild(bubble);
        scrollChatToBottom();
    }

    function submitUserQuery() {
        const prompt = promptInput.value.trim();
        if (!prompt) return;
        appendMessageBubble(prompt, 'user');
        promptInput.value = '';
        toggleSending(true);
        setStatus('Thinking...', '');

        fetch("{% url 'monitoring:copilot_chat_api' %}", {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify({ prompt: prompt })
        })
        .then(r => r.ok ? r.json() : r.json().then(err => { throw err; }))
        .then(data => {
            toggleSending(false);
            if (data.status === 'success') {
                appendMessageBubble(data.message, 'assistant');
                if (data.chart_data && data.chart_data.labels && data.chart_data.labels.length) {
                    appendMessageBubble('_Chart data available — open **AI Co-pilot** page for the full graph._', 'assistant');
                }
                setStatus('Ready', 'ok');
            } else {
                appendMessageBubble('**Error:** ' + (data.message || 'Unknown error'), 'assistant');
                setStatus('Error', 'err');
            }
        })
        .catch(err => {
            toggleSending(false);
            appendMessageBubble('**Connection error:** ' + (err.message || 'Request failed'), 'assistant');
            setStatus('Error', 'err');
        });
    }

    clearChatBtn.addEventListener('click', function() {
        fetch("{% url 'monitoring:clear_chat_history' %}", {
            method: 'POST',
            headers: { 'X-CSRFToken': '{{ csrf_token }}' }
        }).then(r => r.json()).then(data => {
            if (data.status === 'success') {
                chatBox.innerHTML = '<div class="message-bubble assistant"><strong>OSA AI Co-pilot</strong><p class="mb-0 mt-1">Chat cleared. Ask a new question.</p></div>';
                setStatus('Ready', 'ok');
            }
        });
    });
</script>
{% endblock %}
